[project]
name = "reasearch_crew"
version = "1.00"
description = "reasearch_crew using crewAI"
authors = [{ name = "Your Name", email = "you@example.com" }]
requires-python = ">=3.10,<3.14"
dependencies = [
    "crewai[google-genai,tools]>=1.0.0,<2.0.0",
    "litellm>=1.88.1",
    "python-dotenv>=1.2.2",
    "tenacity>=9.1.4",
]

[project.scripts]
reasearch_crew = "reasearch_crew.main:run"
run_crew = "reasearch_crew.main:run"
train = "reasearch_crew.main:train"
replay = "reasearch_crew.main:replay"
test = "reasearch_crew.main:test"
run_with_trigger = "reasearch_crew.main:run_with_trigger"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.crewai]
type = "crew"

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-cov>=7.1.0",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "--cov=reasearch_crew --cov-report=term-missing"

[tool.coverage.run]
source = ["src/reasearch_crew"]
omit = [
    "src/reasearch_crew/main.py",
    "src/reasearch_crew/__init__.py",
    "src/reasearch_crew/version.py",
]
